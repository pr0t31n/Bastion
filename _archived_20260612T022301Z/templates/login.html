<!DOCTYPE html>
<html lang="en" data-palette="tuxedo" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bastion &mdash; Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='none'%3E%3Cpath d='M14 2L4 7v8c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12V7L14 2z' stroke='%23c8a860' stroke-width='2'/%3E%3Cpath d='M10 14l3 3 5-5' stroke='%23c8a860' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    (function(){
      var PALETTES=["tuxedo","meridian","alabaster","leadership","blueprint","resume",
         "foundry","forge","frigid","bloom","prism","ember","oldglory","alchemist",
         "coruscant","retro","jarvis","hal9000","neuromancer","deepspace","bladerunner","synthwave",
         "espresso","terracotta","sage","blush"];
      try {
        var p=localStorage.getItem("bastion-palette");
        var m=localStorage.getItem("bastion-mode");
        var h=document.documentElement;
        h.setAttribute("data-palette",(p&&PALETTES.indexOf(p)!==-1)?p:"resume");
        h.setAttribute("data-mode",(m==="light"||m==="dark")?m:"light");
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .auth-page { background: var(--bg-primary); }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:24px">
      <svg width="48" height="48" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M14 2L4 7v8c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12V7L14 2z"
              fill="none" stroke="var(--accent-primary)" stroke-width="2"/>
        <path d="M10 14l3 3 5-5" stroke="var(--accent-primary)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="auth-title" style="text-align:center">Bastion</div>
    <div class="auth-subtitle" style="text-align:center">Firewall Configuration Analysis Platform</div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control"
               autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="margin-top:8px">Sign In</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
