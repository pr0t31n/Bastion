- id: FW-022
  title: "Redis/Memcached Exposed to External Sources"
  description: "A firewall rule permits Redis (TCP 6379) or Memcached (TCP/UDP 11211) from external sources. Both services have no authentication by default."
  impact: "Unauthenticated Redis allows full data access and remote code execution via EVAL command. Memcached exposure enables data theft and the service has been abused for massive DDoS amplification attacks."
  recommendation: "1. Immediately block TCP 6379 and 11211 from untrusted sources. 2. Enable Redis AUTH and bind to localhost or internal addresses only. 3. Disable Memcached UDP to prevent amplification abuse. 4. Place caching services behind application tier — never expose externally."
  severity: Critical
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 6379
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "In-memory data stores shall not be exposed to untrusted networks."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
