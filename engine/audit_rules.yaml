# ============================================================
# MANAGEMENT SECURITY
# ============================================================
- id: FW-030
  title: "Management Access Not Restricted to Management Zone"
  description: "Firewall management interfaces (HTTPS, SSH, ASDM) are accessible from any source address, including untrusted networks."
  impact: "Unrestricted management access exposes the firewall administrative interface to brute-force attacks, credential stuffing, and exploitation of management interface vulnerabilities."
  recommendation: "1. Restrict all management access to a dedicated out-of-band management network. 2. Block all management protocol access from non-management networks. 3. Implement management VLAN with strict access controls. 4. Enable failed login lockout on management interfaces."
  severity: Critical
  remediation_effort: immediate
  check_type: management_access
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Management interfaces shall be accessible only from authorized management networks."
    - id: "NIST 800-41"
      section: "§3.5"
      control: "Firewall Management"
      requirement: "Firewall management access shall be restricted to authorized personnel and systems."
    - id: "ISO 27001"
      section: "A.8.31"
      control: "Separation of Development, Test and Production Environments"
      requirement: "Management access shall be separated from production traffic."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: H

- id: FW-031
  title: "HTTP Used for Device Management"
  description: "HTTP (cleartext) is enabled for firewall or device management. All management traffic including credentials is transmitted unencrypted."
  impact: "Credentials, session tokens, and configuration changes transmitted via HTTP can be captured by network eavesdroppers. Session hijacking attacks are trivial against HTTP management sessions."
  recommendation: "1. Disable HTTP management on all devices. 2. Enable HTTPS with TLS 1.2 minimum. 3. Install a valid management certificate. 4. Redirect any HTTP management connections to HTTPS."
  severity: High
  remediation_effort: immediate
  check_type: management_access
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-8"
      control: "Transmission Confidentiality and Integrity"
      requirement: "Management sessions shall be encrypted."
    - id: "ISO 27001"
      section: "A.8.24"
      control: "Use of Cryptography"
      requirement: "Management communications shall be protected by appropriate encryption."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: M
    A: N

- id: FW-032
  title: "Telnet Used for Device Management"
  description: "Telnet is enabled as a device management protocol. Telnet provides no encryption, authentication challenge-response visibility, or integrity protection."
  impact: "All management commands, including configuration changes and credentials, are transmitted in cleartext. An attacker with network access can capture and replay management sessions."
  recommendation: "1. Immediately disable Telnet on all devices. 2. Enable SSH version 2 as the sole remote management protocol. 3. Configure SSH with strong cipher suites and MAC algorithms. 4. Remove Telnet from all device configurations."
  severity: Critical
  remediation_effort: immediate
  check_type: management_access
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-8"
      control: "Transmission Confidentiality and Integrity"
      requirement: "All management protocols shall provide confidentiality and integrity."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: H

- id: FW-033
  title: "No Source Restriction on SSH/HTTPS Management Access"
  description: "SSH or HTTPS management access is configured without a source IP restriction, allowing management access from any network."
  impact: "Management access from any source dramatically increases the attack surface for brute-force attacks, credential stuffing, and exploitation of management interface vulnerabilities."
  recommendation: "1. Implement source IP restrictions for all management protocols. 2. Create an explicit management ACL restricting access to management workstation IPs. 3. Use an out-of-band management network where possible."
  severity: Critical
  remediation_effort: immediate
  check_type: management_access
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Management access shall be restricted to authorized source addresses."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: H

- id: FW-034
  title: "HTTPS Management Accessible from Any Source"
  description: "HTTPS device management is accessible from any source IP address. While HTTPS provides encryption, unrestricted access enables credential attacks."
  impact: "Unrestricted HTTPS management enables brute-force and credential stuffing attacks against the management interface. Web-based management interfaces have historically contained exploitable vulnerabilities."
  recommendation: "1. Restrict HTTPS management to specific management IP ranges. 2. Implement account lockout after failed login attempts. 3. Enable multi-factor authentication for management access where supported."
  severity: High
  remediation_effort: short_term
  check_type: management_access
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Management interfaces shall be restricted to authorized management networks."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: M
    A: N

# ============================================================
# LOGGING
# ============================================================
- id: FW-040
  title: "Permit Rules Without Logging Enabled"
  description: "One or more permit (allow) rules do not have logging enabled. Traffic matching these rules is not captured in firewall logs."
  impact: "Without logging on permit rules, allowed traffic is invisible to security monitoring. Attacks, data exfiltration, and lateral movement that uses permitted paths cannot be detected or investigated."
  recommendation: "1. Enable logging on all permit rules. 2. At minimum, enable logging on high-risk rules (any-source, external-to-internal). 3. Forward logs to a centralised SIEM for correlation. 4. Set log level to 'informational' for permit rules to capture connection details."
  severity: High
  remediation_effort: short_term
  check_type: logging
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: logging
        operator: equals
        value: false
  frameworks:
    - id: "NIST SP 800-53"
      section: "AU-2"
      control: "Event Logging"
      requirement: "Identify the types of events to be logged."
    - id: "NIST SP 800-53"
      section: "AU-12"
      control: "Audit Record Generation"
      requirement: "Provide audit record generation capability for permitted traffic."
    - id: "ISO 27001"
      section: "A.8.15"
      control: "Logging"
      requirement: "All significant network events shall be logged."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: N
    A: N

- id: FW-041
  title: "Deny Rules Without Logging Enabled"
  description: "One or more deny rules do not have logging enabled. Blocked connection attempts are not captured in firewall logs."
  impact: "Without logging on deny rules, attack attempts against blocked services are invisible. Security teams cannot detect port scans, reconnaissance, or blocked attack attempts."
  recommendation: "1. Enable logging on all deny rules, particularly the default-deny rule. 2. Use logging levels that capture the necessary detail (source IP, destination, port, protocol). 3. Implement log aggregation and alerting for suspicious deny patterns."
  severity: Medium
  remediation_effort: short_term
  check_type: logging
  criteria:
    and:
      - field: action
        operator: equals
        value: "deny"
      - field: logging
        operator: equals
        value: false
  frameworks:
    - id: "NIST SP 800-53"
      section: "AU-2"
      control: "Event Logging"
      requirement: "Log all denied connection attempts."
    - id: "ISO 27001"
      section: "A.8.15"
      control: "Logging"
      requirement: "Failed access attempts shall be logged."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: N
    A: N

- id: FW-042
  title: "No Logging Configured — Complete Forensic Blind Spot"
  description: "No firewall rules in this configuration have logging enabled. The firewall is operating without any security event logging, creating a complete forensic blind spot."
  impact: "Without any logging, the organisation cannot detect attacks, investigate incidents, demonstrate compliance, or understand traffic patterns. This is a fundamental security control failure."
  recommendation: "1. Immediately enable logging on all permit rules. 2. Enable logging on the default-deny rule. 3. Configure syslog forwarding to a SIEM. 4. Define a log retention policy (minimum 90 days online, 1 year archived). 5. Establish a log review process."
  severity: Critical
  remediation_effort: immediate
  check_type: logging
  frameworks:
    - id: "NIST SP 800-53"
      section: "AU-2"
      control: "Event Logging"
      requirement: "Log significant network security events."
    - id: "NIST SP 800-53"
      section: "AU-12"
      control: "Audit Record Generation"
      requirement: "Firewall shall generate audit records for defined events."
    - id: "ISO 27001"
      section: "A.8.15"
      control: "Logging"
      requirement: "Network security events shall be logged and monitored."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
