- id: FW-023
  title: "TFTP Permitted Through Firewall"
  description: "A firewall rule permits TFTP (UDP 69). TFTP has no authentication mechanism — any client that can reach the TFTP server can read and write files."
  impact: "TFTP enables unauthenticated file reads and writes. Attackers who can reach TFTP servers can read configuration files, firmware, and write malicious files."
  recommendation: "1. Block UDP 69 at all firewall boundaries. 2. Restrict TFTP to isolated management VLAN if required for network device management. 3. Use SCP or SFTP instead of TFTP for device provisioning."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 69
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Unauthenticated file transfer protocols shall be blocked."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: H
    A: N

- id: FW-024
  title: "NTP Access Not Restricted to Trusted Sources"
  description: "A firewall rule permits NTP (UDP 123) from any source without restriction. Open NTP servers can be abused for reflection/amplification DDoS attacks."
  impact: "Unrestricted NTP access enables use of the firewall's internal NTP infrastructure as a DDoS amplification source. NTP amplification attacks achieve amplification factors of up to 556x."
  recommendation: "1. Restrict NTP to specific trusted time sources (external) and internal clients only. 2. Disable NTP monlist and other amplification-capable commands. 3. Rate-limit NTP responses."
  severity: Medium
  remediation_effort: short_term
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 123
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Time synchronization services shall be restricted to authorized sources."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: N
    I: N
    A: H

- id: FW-025
  title: "DNS Outbound Not Restricted to Authorised Resolvers"
  description: "Outbound DNS (UDP/TCP 53) is permitted from any internal host to any external destination, allowing direct DNS resolution to arbitrary external servers."
  impact: "Unrestricted outbound DNS enables DNS tunneling for data exfiltration, circumvents DNS-based security controls (sinkholes, RPZ), and allows malware to use any DNS server for C2 communication."
  recommendation: "1. Restrict outbound DNS to authorised internal resolvers only. 2. Block direct outbound DNS from all hosts except designated resolvers. 3. Implement DNS logging and monitoring. 4. Deploy DNS filtering (RPZ, DNS firewall) on authorised resolvers."
  severity: Low
  remediation_effort: short_term
  check_type: rule_criteria
  criteria:
