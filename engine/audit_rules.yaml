- id: FW-021
  title: "Elasticsearch Exposed to External Sources (TCP 9200/9300)"
  description: "A firewall rule permits Elasticsearch (TCP 9200 HTTP API or 9300 transport) from external or untrusted sources. Elasticsearch has no authentication by default."
  impact: "Unauthenticated Elasticsearch instances have led to some of the largest data breaches in history. All indexed data is accessible to anyone who can reach port 9200."
  recommendation: "1. Immediately block TCP 9200 and 9300 from all untrusted sources. 2. Enable Elasticsearch security features (X-Pack/Security). 3. Implement TLS and authentication. 4. Place Elasticsearch behind a reverse proxy with authentication."
  severity: Critical
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 9200
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Search and analytics databases shall not be publicly accessible."
  cvss_components:
