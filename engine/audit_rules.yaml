      control: "Boundary Protection"
      requirement: "DNS resolution shall be directed through controlled resolvers."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: L
    I: L
    A: N

- id: FW-026
  title: "ICMP Not Restricted"
  description: "ICMP is permitted without source or destination restriction. While necessary for network diagnostics, unrestricted ICMP enables network reconnaissance and covert channel communication."
  impact: "ICMP ping sweeps reveal network topology. ICMP tunneling (iodine, icmptunnel) enables covert data exfiltration. ICMP redirect messages can be used for man-in-the-middle attacks."
  recommendation: "1. Restrict inbound ICMP to only needed types (echo-reply, unreachable, time-exceeded). 2. Block ICMP echo from external sources or restrict to monitoring IPs. 3. Consider rate-limiting ICMP."
  severity: Informational
  remediation_effort: long_term
  check_type: rule_criteria
