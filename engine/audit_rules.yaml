- id: FW-083
  title: "RDP Permitted on Non-Standard Ports"
  description: "Remote Desktop Protocol is permitted on non-standard ports (not 3389), suggesting an attempt to obscure RDP exposure. Security by obscurity does not reduce the actual risk."
  impact: "RDP running on non-standard ports is discovered by modern port scanners within minutes. The underlying RDP vulnerabilities and risks remain identical regardless of port number."
  recommendation: "1. Treat RDP on non-standard ports with the same urgency as standard-port RDP. 2. Implement proper access controls (VPN, specific source IPs) rather than port obfuscation. 3. Consider replacing RDP with a zero-trust remote access solution."
  severity: Medium
  remediation_effort: short_term
  check_type: rulebase_structure
  frameworks:
