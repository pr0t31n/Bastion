# Bastion Audit Rules — Base ruleset (all vendors)
# Required fields: id, title, description, impact, recommendation,
#   severity, remediation_effort, check_type, frameworks, cvss_components

# ============================================================
# RULE BASE STRUCTURE
# ============================================================
- id: FW-001
  title: "No Default-Deny Rule at End of Policy"
  description: "No explicit default-deny (implicit permit-all) rule exists at the end of the access control list or policy group. Traffic not matching any rule is permitted rather than dropped."
  impact: "Unintended traffic flows reach internal systems. Attackers can exploit missing coverage to access systems that policy authors assumed were protected."
  recommendation: "1. Add an explicit 'deny ip any any log' rule as the final entry in every ACL. 2. Ensure the deny-all rule includes logging to capture all traffic hitting the implicit deny. 3. Review all traffic flows to confirm intended rules precede the default deny. 4. Test the rule using traffic simulation before deploying to production."
  severity: Critical
  remediation_effort: immediate
  check_type: rulebase_structure
  frameworks:
    - id: "NIST 800-41"
      section: "§3.2"
      control: "Default Deny Policy"
      requirement: "Firewall policy should deny all traffic not explicitly permitted."
    - id: "NIST SP 800-53"
      section: "SC-7(5)"
      control: "Deny by Default / Allow by Exception"
      requirement: "Implement a default deny policy for network communications."
    - id: "ISO 27001"
      section: "A.8.20"
      control: "Network Security"
      requirement: "Networks shall be managed and controlled to protect information."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: H

- id: FW-002
  title: "Any-Any-Any Permit Rule Detected"
  description: "A firewall rule permits all traffic from any source to any destination on all ports and protocols. This is the most dangerous firewall misconfiguration possible."
  impact: "The firewall provides no access control. All traffic is permitted regardless of source, destination, or protocol."
  recommendation: "1. Immediately remove or disable the any-any permit rule. 2. Implement principle of least privilege — only permit required traffic flows. 3. Document all required flows before rebuilding the policy. 4. Use a test environment to validate replacement rules before deploying."
  severity: Critical
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
      - field: dst_addresses
        operator: contains
        value: "0.0.0.0/0"
      - field: dst_ports
        operator: is_null
  frameworks:
    - id: "NIST 800-41"
      section: "§3.2"
      control: "Default Deny Policy"
      requirement: "Firewall policy should deny all traffic not explicitly permitted."
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Monitor and control communications at external and internal boundaries."
    - id: "ISO 27001"
      section: "A.8.22"
      control: "Segregation of Networks"
      requirement: "Networks shall be segregated based on information security requirements."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: H
    I: H
    A: H

- id: FW-004
  title: "Disabled Rules Present in Production Configuration"
  description: "One or more firewall rules are disabled (inactive) in the production configuration. Disabled rules accumulate over time and indicate configuration drift or incomplete cleanup."
  impact: "Disabled rules represent policy intent that is no longer enforced. They create confusion during audits, may be re-enabled accidentally, and indicate the policy requires cleanup."
  recommendation: "1. Review all disabled rules and determine if they are still required. 2. Remove disabled rules that are no longer needed. 3. Document the reason for any disabled rules that must be retained. 4. Establish a policy lifecycle process to prevent accumulation of disabled rules."
  severity: Low
  remediation_effort: long_term
  check_type: rule_criteria
  criteria:
    field: enabled
    operator: equals
    value: false
  frameworks:
    - id: "NIST 800-41"
      section: "§4.1"
      control: "Firewall Policy Management"
      requirement: "Firewall rules should be reviewed and maintained regularly."
    - id: "ISO 27001"
      section: "A.8.9"
      control: "Configuration Management"
      requirement: "Configurations shall be managed and documented."
  cvss_components:
    AV: N
    AC: H
    PR: L
    UI: R
    S: U
    C: L
    I: L
    A: N

- id: FW-005
  title: "Duplicate Firewall Rules Detected"
  description: "Two or more firewall rules have identical source, destination, port, and action specifications. Duplicate rules indicate policy bloat and maintenance issues."
  impact: "Duplicate rules increase management overhead, create confusion during incident response, and may indicate the policy review process is not working correctly."
  recommendation: "1. Identify and remove all duplicate rules. 2. Implement a rule review process that checks for duplicates before policy deployment. 3. Use firewall management tools that flag duplicate rules automatically."
  severity: Medium
  remediation_effort: short_term
  check_type: rulebase_structure
  frameworks:
    - id: "NIST 800-41"
      section: "§4.1"
      control: "Firewall Policy Management"
      requirement: "Firewall rules should be reviewed and maintained regularly."
    - id: "ISO 27001"
      section: "A.8.9"
      control: "Configuration Management"
      requirement: "Configurations shall be managed and documented."
  cvss_components:
    AV: N
    AC: H
    PR: L
    UI: R
    S: U
    C: N
    I: L
    A: N

- id: FW-006
  title: "Shadowed Rules — Unreachable Policy Entries"
  description: "One or more firewall rules are completely covered (shadowed) by earlier, broader rules and will never be evaluated. Shadowed rules indicate policy maintenance issues and potential security gaps."
  impact: "Shadowed rules are never executed. If the shadowing rule has a different action than the shadowed rule, traffic may be handled contrary to policy intent."
  recommendation: "1. Reorder rules so more specific rules precede broader rules. 2. Remove rules that are completely redundant given preceding rules. 3. Implement rule ordering verification in change management process."
  severity: Medium
  remediation_effort: short_term
  check_type: rulebase_structure
  frameworks:
    - id: "NIST 800-41"
      section: "§4.1"
      control: "Firewall Policy Management"
      requirement: "Firewall rules should be ordered for correct evaluation."
    - id: "ISO 27001"
      section: "A.8.9"
      control: "Configuration Management"
      requirement: "Configurations shall be managed and documented."
  cvss_components:
    AV: N
    AC: H
    PR: L
    UI: R
    S: U
    C: L
    I: L
    A: N

- id: FW-007
  title: "Suboptimal Rule Ordering"
  description: "Frequently-hit rules appear after less-used rules in the policy list. This degrades performance as the firewall must evaluate all preceding rules before reaching the effective rule."
  impact: "Increased latency for matching traffic. In high-volume environments, suboptimal ordering can degrade firewall throughput."
  recommendation: "1. Place high-volume deny rules (e.g., blocklists) near the top of the policy. 2. Place more specific, lower-volume rules before broad rules. 3. Use hit count data to determine optimal ordering."
  severity: Low
  remediation_effort: long_term
  check_type: rulebase_structure
  frameworks:
    - id: "NIST 800-41"
      section: "§4.1"
      control: "Firewall Policy Management"
      requirement: "Firewall rules should be ordered for efficiency and correctness."
  cvss_components:
    AV: N
    AC: H
    PR: L
    UI: N
    S: U
    C: N
    I: N
    A: L

# ============================================================
# DANGEROUS PORT EXPOSURE
# ============================================================
- id: FW-010
  title: "RDP Permitted from Any Source"
  description: "A firewall rule permits Remote Desktop Protocol (RDP, TCP 3389) inbound from any source address. RDP is one of the most commonly exploited services for ransomware and lateral movement."
  impact: "Exposed RDP is a primary attack vector for ransomware gangs, APT groups, and commodity attackers. Authentication bypass vulnerabilities (BlueKeep, DejaBlue) regularly affect RDP."
  recommendation: "1. Immediately restrict RDP access to specific management IP ranges. 2. Place RDP behind a VPN or RDP Gateway. 3. Enable Network Level Authentication (NLA). 4. Implement account lockout policies. 5. Consider replacing RDP with a zero-trust remote access solution."
  severity: Critical
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 3389
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Restrict access to only authorized remote access methods."
    - id: "NIST 800-41"
      section: "§3.3"
      control: "Inbound Access Control"
      requirement: "Remote access services must be restricted to authorized sources."
    - id: "ISO 27001"
      section: "A.8.20"
      control: "Network Security"
      requirement: "Remote access should be protected with appropriate controls."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: H

- id: FW-011
  title: "SSH Permitted from External/Untrusted Sources"
  description: "A firewall rule permits SSH (TCP 22) from untrusted or external sources. SSH brute-force attacks are extremely common against internet-exposed SSH."
  impact: "Exposed SSH enables brute-force attacks, credential stuffing, and exploitation of SSH vulnerabilities. Compromised SSH access provides immediate shell access to the target system."
  recommendation: "1. Restrict SSH to management IP addresses only. 2. Implement SSH key-based authentication and disable password authentication. 3. Change SSH to a non-standard port (security by obscurity, not a primary control). 4. Implement fail2ban or equivalent brute-force protection. 5. Consider placing SSH behind a jump host or bastion server."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 22
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Restrict remote administration access to authorized management stations."
    - id: "NIST 800-41"
      section: "§3.3"
      control: "Inbound Access Control"
      requirement: "SSH should be restricted to authorized management sources."
    - id: "ISO 27001"
      section: "A.8.20"
      control: "Network Security"
      requirement: "Remote administration shall be controlled and monitored."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: L

- id: FW-012
  title: "Telnet Permitted Through Firewall"
  description: "A firewall rule permits Telnet (TCP 23). Telnet transmits all data including credentials in plaintext and has been deprecated for over 25 years."
  impact: "All Telnet communications, including authentication credentials, are transmitted in cleartext and can be intercepted by network eavesdroppers. No confidentiality or integrity protection exists."
  recommendation: "1. Immediately block all Telnet traffic. 2. Replace all Telnet-dependent systems with SSH. 3. If Telnet is required for legacy systems, isolate those systems and implement compensating controls. 4. Review device configurations to ensure SSH is enabled on all network equipment."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 23
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-8"
      control: "Transmission Confidentiality and Integrity"
      requirement: "Implement cryptographic mechanisms to prevent unauthorized disclosure during transmission."
    - id: "NIST 800-41"
      section: "§3.3"
      control: "Cleartext Protocol Restriction"
      requirement: "Cleartext management protocols shall not traverse the firewall."
    - id: "ISO 27001"
      section: "A.8.24"
      control: "Use of Cryptography"
      requirement: "Cryptographic controls shall be used for information transmitted over networks."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: M
    A: N

- id: FW-013
  title: "FTP Permitted Through Firewall"
  description: "A firewall rule permits FTP (TCP 20/21). FTP transmits credentials and data in plaintext and supports anonymous authentication by default on many implementations."
  impact: "FTP credentials and file contents are transmitted in cleartext. Anonymous FTP can expose sensitive files. FTP's PORT command can be abused for firewall bypass (FTP bounce attacks)."
  recommendation: "1. Replace FTP with SFTP (SSH File Transfer Protocol) or FTPS (FTP over TLS). 2. If FTP must be used, restrict to internal networks only. 3. Disable anonymous FTP. 4. Implement strict file transfer policies."
  severity: Medium
  remediation_effort: short_term
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 21
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-8"
      control: "Transmission Confidentiality and Integrity"
      requirement: "Use cryptographic mechanisms to protect file transfers."
    - id: "ISO 27001"
      section: "A.8.24"
      control: "Use of Cryptography"
      requirement: "Encrypt data in transit using appropriate mechanisms."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: M
    A: N

- id: FW-014
  title: "SMB Permitted from External Sources (TCP 445)"
  description: "A firewall rule permits SMB (TCP 445) from external/untrusted sources. SMB is the primary protocol used by ransomware (WannaCry, NotPetya, EternalBlue) for lateral movement."
  impact: "Exposed SMB is the most common ransomware infection vector. EternalBlue and related exploits are still widely used in ransomware campaigns. SMB exposure directly enables catastrophic data encryption attacks."
  recommendation: "1. Immediately block TCP 445 from all untrusted sources. 2. Block UDP 137-138 and TCP 139 (NetBIOS) as well. 3. Audit internal SMB to ensure it is restricted to required segments. 4. Implement host-based firewall rules in addition to network firewall. 5. Keep Windows systems patched against EternalBlue."
  severity: Critical
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 445
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Block all SMB traffic at the network perimeter."
    - id: "NIST 800-41"
      section: "§3.3"
      control: "Inbound Access Control"
      requirement: "File sharing protocols shall not be permitted from external sources."
    - id: "ISO 27001"
      section: "A.8.22"
      control: "Segregation of Networks"
      requirement: "SMB shall be restricted to internal segments only."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: H
    I: H
    A: H

- id: FW-015
  title: "MS-RPC Permitted from External Sources (TCP 135)"
  description: "A firewall rule permits Microsoft RPC (TCP 135) from external sources. MS-RPC is a critical Windows service used for DCOM, WMI, and many Windows management interfaces."
  impact: "Exposed MS-RPC enables remote exploitation of Windows services via DCOM and WMI. Historically abused by Blaster, Sasser, and modern APT groups for remote code execution."
  recommendation: "1. Block TCP 135 from all external sources. 2. Block the entire RPC dynamic port range (TCP 49152-65535) from external sources. 3. Consider blocking RPC internally except between required systems."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 135
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Block Windows RPC services from external access."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: H
    I: H
    A: H

- id: FW-016
  title: "NetBIOS Permitted Through Firewall"
  description: "A firewall rule permits NetBIOS (UDP 137-138, TCP 139) traffic. NetBIOS is a legacy Windows protocol that enables reconnaissance, credential theft (LLMNR/NBT-NS poisoning), and lateral movement."
  impact: "NetBIOS enables LLMNR and NBT-NS poisoning attacks, NetBIOS name query reconnaissance, and credential capture via Responder-style attacks. Should never traverse firewall boundaries."
  recommendation: "1. Block UDP 137, 138 and TCP 139 at all firewall boundaries. 2. Disable NetBIOS over TCP/IP on Windows hosts where not required. 3. Disable LLMNR and NBT-NS via Group Policy."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 139
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Block legacy Windows network protocols from crossing zone boundaries."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: M
    A: N

- id: FW-017
  title: "SNMP Permitted from Any Source"
  description: "A firewall rule permits SNMP (UDP 161) from any source address. SNMP exposes device configurations, routing tables, and interface statistics to anyone who can reach the port."
  impact: "SNMP v1/v2c use community strings for authentication (effectively cleartext passwords). An attacker with SNMP access can read full device configurations, enumerate network topology, and potentially write configurations if community string permits."
  recommendation: "1. Restrict SNMP to dedicated monitoring IP addresses only. 2. Upgrade to SNMPv3 with authentication and encryption. 3. Use ACLs on network devices themselves, not just the firewall. 4. Change default community strings (public/private)."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 161
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Restrict SNMP access to authorized management systems."
    - id: "ISO 27001"
      section: "A.8.20"
      control: "Network Security"
      requirement: "Network management protocols shall be restricted to authorized management stations."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: M
    A: N

- id: FW-018
  title: "SNMP v1/v2c Weak Authentication Exposure"
  description: "SNMP is permitted through the firewall with likely v1/v2c community string authentication. SNMPv1 and v2c use cleartext community strings that can be sniffed."
  impact: "Community strings transmitted in cleartext can be captured and used for unauthorized device access. Many devices ship with default community strings (public/private)."
  recommendation: "1. Migrate to SNMPv3 with AuthPriv security level. 2. If SNMP v1/v2c must be used, restrict to isolated management VLAN. 3. Change all community strings from defaults. 4. Implement SNMPv3 privacy (encryption) for sensitive data."
  severity: High
  remediation_effort: short_term
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 161
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-8"
      control: "Transmission Confidentiality and Integrity"
      requirement: "Use encrypted management protocols for network device management."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: L
    A: N

- id: FW-019
  title: "WinRM Permitted from External Sources (TCP 5985/5986)"
  description: "A firewall rule permits Windows Remote Management (WinRM, TCP 5985 HTTP or 5986 HTTPS) from external sources. WinRM provides PowerShell remoting and remote command execution."
  impact: "Exposed WinRM enables remote command execution via PowerShell. Commonly used by attackers for lateral movement and persistence once credentials are compromised."
  recommendation: "1. Block TCP 5985 and 5986 from all untrusted sources. 2. Restrict WinRM to management IP ranges only. 3. Require HTTPS (5986) over HTTP (5985). 4. Implement WinRM access control lists."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 5985
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Remote management protocols shall be restricted to authorized sources."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: H
    I: H
    A: H

- id: FW-020
  title: "Database Ports Exposed to External Sources"
  description: "A firewall rule permits database service ports (MySQL TCP 3306, MSSQL TCP 1433, PostgreSQL TCP 5432, Oracle TCP 1521) from external or untrusted sources."
  impact: "Direct database exposure enables SQL injection amplification, credential brute-force against database authentication, and direct data exfiltration. Databases should never be directly internet-accessible."
  recommendation: "1. Immediately block all database ports from untrusted sources. 2. Place databases in a dedicated database VLAN accessible only from application servers. 3. Implement database activity monitoring (DAM). 4. Use application-layer database proxies where possible."
  severity: Critical
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 1433
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Database services shall not be directly accessible from untrusted networks."
    - id: "ISO 27001"
      section: "A.8.22"
      control: "Segregation of Networks"
      requirement: "Database servers shall be isolated in a dedicated network segment."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
