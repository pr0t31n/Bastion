# ============================================================
# SEGMENTATION
# ============================================================
- id: FW-050
  title: "No DMZ (Demilitarised Zone) Detected"
  description: "No DMZ zone or interface has been identified in the firewall configuration. Public-facing services appear to be placed in the same zone as internal systems."
  impact: "Without a DMZ, compromising a public-facing server (web, email, DNS) provides direct access to internal systems. This eliminates a critical layer of defence-in-depth."
  recommendation: "1. Create a dedicated DMZ zone for all public-facing servers. 2. Configure the DMZ with an intermediate security level. 3. Implement strict policies between DMZ and internal zones. 4. Ensure DMZ servers cannot initiate connections to internal systems."
  severity: High
  remediation_effort: long_term
  check_type: segmentation
  frameworks:
    - id: "NIST 800-41"
      section: "§3.4"
      control: "DMZ Architecture"
      requirement: "Public-facing servers shall be isolated in a DMZ segment."
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Implement a DMZ to protect internal resources from external threats."
    - id: "ISO 27001"
      section: "A.8.22"
      control: "Segregation of Networks"
      requirement: "Public-facing services shall be segregated from internal systems."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: H
    I: H
    A: L

- id: FW-051
  title: "Direct Internet-to-Internal Permit Without DMZ Intermediate"
  description: "Permit rules exist that allow direct traffic from the external/internet zone to internal high-trust zones without passing through a DMZ or intermediate inspection zone."
  impact: "Traffic from the internet reaches internal systems directly. A single exploitation event on an internet-facing system could lead to direct internal network compromise."
  recommendation: "1. Redesign traffic flows to route internet traffic through a DMZ. 2. Place all public-facing services in the DMZ. 3. Implement application-layer inspection between DMZ and internal zones. 4. Require explicit permit rules for DMZ-to-internal traffic."
  severity: High
  remediation_effort: long_term
  check_type: segmentation
  frameworks:
    - id: "NIST 800-41"
      section: "§3.4"
      control: "DMZ Architecture"
      requirement: "All external traffic shall traverse a DMZ before reaching internal networks."
    - id: "ISO 27001"
      section: "A.8.22"
      control: "Segregation of Networks"
      requirement: "Internal networks shall be protected from direct external access."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: H
    I: H
    A: L

- id: FW-052
  title: "Flat Network — Only One Zone or Interface Defined"
  description: "The firewall configuration defines only a single zone or network interface. All traffic flows through a single segment with no internal segmentation."
  impact: "A flat network means a single compromised host can communicate with any other host. Lateral movement is trivial and ransomware can spread unimpeded."
  recommendation: "1. Segment the network into functional zones (internal, DMZ, management, guest). 2. Implement firewall policies between each zone pair. 3. Consider microsegmentation for high-value systems. 4. Progressively add zones as part of a phased network redesign."
  severity: High
  remediation_effort: long_term
  check_type: segmentation
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Implement network segmentation to limit lateral movement."
    - id: "ISO 27001"
      section: "A.8.22"
      control: "Segregation of Networks"
      requirement: "Networks shall be segregated based on information classification and risk."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: H
    I: H
    A: L

- id: FW-053
  title: "Server-to-Workstation Traffic Unrestricted"
  description: "No rules restrict east-west traffic between server and workstation segments. Servers can initiate connections to workstations and vice versa without inspection."
  impact: "Unrestricted server-to-workstation traffic enables ransomware propagation, lateral movement from compromised servers to workstations, and from workstations to servers."
  recommendation: "1. Implement east-west segmentation between server and workstation VLANs. 2. Deny all server-initiated connections to workstation networks. 3. Permit only required application ports from workstations to servers. 4. Implement network monitoring to detect anomalous east-west traffic."
  severity: Medium
  remediation_effort: long_term
  check_type: segmentation
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Implement controls to limit lateral movement within the network."
  cvss_components:
    AV: N
    AC: L
    PR: L
    UI: N
    S: C
    C: H
    I: H
    A: L

# ============================================================
# NAT
# ============================================================
- id: FW-060
  title: "Internal RFC-1918 Addresses Potentially Reachable Without NAT"
  description: "Permit rules allow traffic to private (RFC-1918) destination addresses from external zones without corresponding NAT translations, potentially exposing internal addressing."
  impact: "If RFC-1918 addresses are routed externally without NAT, internal network topology is exposed. This can enable direct attacks against internal systems or reveal sensitive network design information."
  recommendation: "1. Verify that NAT is configured for all rules permitting external traffic to internal RFC-1918 destinations. 2. Ensure that external routing does not leak RFC-1918 prefixes. 3. Implement NAT for all internal-to-external traffic flows."
  severity: High
  remediation_effort: short_term
  check_type: nat
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Internal network addressing shall not be exposed to untrusted networks."
    - id: "NIST 800-41"
      section: "§3.3"
      control: "NAT Policy"
      requirement: "RFC-1918 addresses shall be translated at zone boundaries."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: M
    A: N

- id: FW-061
  title: "1:1 Static NAT Exposes Internal Host Directly to Internet"
  description: "A 1:1 static NAT mapping exposes an internal host directly to the internet with full port translation. All ports on the internal host are potentially reachable."
  impact: "Static NAT 1:1 mappings expose the complete attack surface of the mapped internal host. Any vulnerability on that host is directly exploitable from the internet."
  recommendation: "1. Replace 1:1 static NAT with port-specific NAT where possible. 2. Implement access control lists in combination with static NAT. 3. Only expose specific required ports, not the full host. 4. Move services requiring internet exposure to a DMZ with strict policies."
  severity: Medium
  remediation_effort: short_term
  check_type: nat
  frameworks:
    - id: "NIST 800-41"
      section: "§3.3"
      control: "NAT Policy"
      requirement: "NAT configurations shall minimise exposed attack surface."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: M
    A: N

# ============================================================
# PROTOCOL SPECIFIC
# ============================================================
- id: FW-070
  title: "IPv6 Traffic Not Addressed in Policy"
  description: "The firewall configuration does not include explicit IPv6 policy rules. If IPv6 is enabled on interfaces, traffic may be uncontrolled."
  impact: "Unmanaged IPv6 traffic may bypass IPv4 security controls. Dual-stack hosts may be reachable via IPv6 paths that are not covered by the IPv4 firewall policy."
  recommendation: "1. Audit all interfaces for IPv6 enablement. 2. If IPv6 is not required, disable it on all interfaces. 3. If IPv6 is used, implement a full dual-stack firewall policy mirroring IPv4 controls. 4. Block IPv6 tunnelling protocols (6to4, Teredo, ISATAP) at the perimeter."
  severity: Medium
  remediation_effort: short_term
  check_type: rulebase_structure
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "IPv6 traffic shall be subject to the same access controls as IPv4."
  cvss_components:
    AV: N
    AC: H
    PR: N
    UI: N
    S: U
    C: M
    I: M
    A: N

- id: FW-071
  title: "GRE/IPSec Tunnels Permitted Without Authentication Requirement"
  description: "GRE (protocol 47) or IPSec (ESP/AH, protocols 50/51) tunnelling is permitted without authentication requirements enforced at the firewall level."
  impact: "Unauthenticated GRE tunnels can be used to encapsulate and hide malicious traffic, bypassing application-layer inspection. GRE provides no confidentiality or integrity."
  recommendation: "1. Replace GRE with authenticated IPSec tunnels. 2. Implement IKEv2 with strong authentication for all VPN tunnels. 3. If GRE is required, encapsulate in IPSec. 4. Implement strict source/destination restrictions on tunnel endpoints."
  severity: Medium
  remediation_effort: short_term
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: protocol
        operator: equals
        value: "gre"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-8"
      control: "Transmission Confidentiality and Integrity"
      requirement: "Tunnel endpoints shall be authenticated and traffic encrypted."
  cvss_components:
    AV: N
    AC: H
    PR: N
    UI: N
    S: U
    C: M
    I: M
    A: N

- id: FW-072
  title: "BGP/OSPF Routing Protocols Permitted from External Sources"
  description: "BGP (TCP 179) or OSPF routing protocol traffic is permitted from external or untrusted sources. Routing protocol injection can manipulate network traffic paths."
  impact: "Rogue BGP sessions or OSPF updates can redirect traffic to attacker-controlled destinations, enable man-in-the-middle attacks, or cause network-wide outages."
  recommendation: "1. Block BGP (TCP 179) from untrusted sources. 2. Implement BGP authentication (MD5 or TCP-AO). 3. Implement OSPF authentication. 4. Restrict routing protocol traffic to dedicated peering addresses."
  severity: High
  remediation_effort: immediate
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 179
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Routing protocols shall be restricted to authorised peers."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: C
    C: L
    I: H
    A: H

- id: FW-073
  title: "Outbound SMTP Not Restricted to Mail Relay"
  description: "Outbound SMTP (TCP 25) is permitted from internal networks to any external destination, allowing any internal host to send email directly to external mail servers."
  impact: "Unrestricted outbound SMTP enables malware to send spam, phishing emails, and data exfiltration via email from any compromised internal host. This also contributes to IP reputation damage."
  recommendation: "1. Block outbound TCP 25 from all hosts except designated mail relays. 2. Route all outbound SMTP through a controlled mail relay/gateway. 3. Implement outbound email filtering and DMARC/SPF/DKIM. 4. Monitor for anomalous outbound email volumes."
  severity: Medium
  remediation_effort: short_term
  check_type: rule_criteria
  criteria:
    and:
      - field: action
        operator: equals
        value: "permit"
      - field: dst_ports
        operator: matches
        value: 25
      - field: src_addresses
        operator: contains
        value: "0.0.0.0/0"
  frameworks:
    - id: "NIST SP 800-53"
      section: "SC-7"
      control: "Boundary Protection"
      requirement: "Outbound email shall be routed through controlled gateways."
  cvss_components:
    AV: N
    AC: L
    PR: N
    UI: N
    S: U
    C: M
    I: M
    A: N

- id: FW-074
  title: "TLS/SSL Bypass or Inspection Not Configured"
  description: "Encrypted traffic (HTTPS/TLS) is permitted through the firewall without any indication of SSL/TLS inspection being configured. Malware and data exfiltration commonly use HTTPS to evade detection."
  impact: "Encrypted traffic bypasses all application-layer inspection. Malware C2 communications, data exfiltration, and phishing content cannot be inspected or blocked."
  recommendation: "1. Implement SSL/TLS inspection where technically and legally feasible. 2. At minimum, block HTTPS to known malicious categories via DNS. 3. Implement certificate pinning bypass detection. 4. Consider decryption zones for high-risk traffic categories."
  severity: Medium
  remediation_effort: long_term
